name: my_rag-backend

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

    volumes:
      - type: bind
        source: D:/RAG/MinIO
        target: /data

    command: server /data --console-address ":9001"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - type: bind
        source: D:/RAG/Qdrant
        target: /qdrant/storage

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora-webapi:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: ${COMPOSE_POSTGRES_CONNECTION_STRING:-}
      Cors__AllowedOrigins__0: http://localhost:3000
      AllowedHosts: localhost
      Storage__Endpoint: http://minio:9000
      Qdrant__Endpoint: http://qdrant:6333

  frontend:
    build:
      context: ../my_rag-frontend
      dockerfile: Dockerfile
    image: nexora-frontend:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      webapi:
        condition: service_started
    ports:
      - "3000:80"
    environment:
      PUBLIC_API_URL: http://localhost:8081
