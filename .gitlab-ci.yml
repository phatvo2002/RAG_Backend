workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify
  - image

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOCKERHUB_REPOSITORY: "nexora-webapi"

cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

verify:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0

  script:
    - |
      echo "===== DOTNET INFO ====="
      dotnet --info

    - |
      echo "===== NUGET SOURCES ====="
      dotnet nuget list source

    - |
      echo "===== RESTORE ====="
      dotnet restore Nexora.sln \
        --source https://api.nuget.org/v3/index.json \
        -p:NuGetAudit=false \
        --verbosity minimal

    - |
      echo "===== BUILD ====="
      dotnet build Nexora.sln \
        --configuration Release \
        --no-restore \
        --verbosity minimal

    - |
      echo "===== TEST ====="
      dotnet test tests/Nexora.Tests/Nexora.Tests.csproj \
        --configuration Release \
        --no-build \
        --no-restore \
        --logger "console;verbosity=minimal"

build_and_push_image:
  stage: image
  image: docker:24.0.5-cli

  services:
    - name: docker:24.0.5-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: "overlay2"

  needs:
    - job: verify

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  before_script:
    - |
      echo "===== INSTALL TOOLS ====="
      apk add --no-cache curl

    - |
      echo "===== CHECK REQUIRED VARIABLES ====="

      if [ -z "$DOCKERHUB_USERNAME" ]; then
        echo "DOCKERHUB_USERNAME is required"
        exit 1
      fi

      if [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_TOKEN is required"
        exit 1
      fi

      if [ -z "$DOCKERHUB_REPOSITORY" ]; then
        echo "DOCKERHUB_REPOSITORY is required"
        exit 1
      fi

    - |
      echo "===== TEST NUGET CONNECTION ====="

      curl -4 \
        --fail \
        --show-error \
        --connect-timeout 10 \
        --max-time 20 \
        https://api.nuget.org/v3/index.json \
        > /dev/null

      echo "NuGet connection OK"

    - |
      echo "===== WAIT FOR DOCKER ====="

      timeout=30

      until docker info > /dev/null 2>&1; do
        if [ "$timeout" -le 0 ]; then
          echo "Docker daemon is not available"
          exit 1
        fi

        echo "Waiting for Docker daemon..."
        sleep 1
        timeout=$((timeout - 1))
      done

      echo "Docker daemon is ready"

    - |
      echo "===== DOCKER LOGIN ====="

      echo "$DOCKERHUB_TOKEN" | docker login \
        --username "$DOCKERHUB_USERNAME" \
        --password-stdin

  script:
    - |
      IMAGE_REPOSITORY="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY"
      IMAGE_SHA="$IMAGE_REPOSITORY:$CI_COMMIT_SHORT_SHA"

      echo "===== IMAGE INFO ====="
      echo "DockerHub username   = $DOCKERHUB_USERNAME"
      echo "DockerHub repository = $DOCKERHUB_REPOSITORY"
      echo "Image repository     = $IMAGE_REPOSITORY"
      echo "Image SHA            = $IMAGE_SHA"

      echo "===== BUILD IMAGE ====="

      docker build \
        --pull \
        --progress=plain \
        --tag "$IMAGE_SHA" \
        .

      echo "===== PUSH SHA IMAGE ====="

      docker push "$IMAGE_SHA"

      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_VERSION="$IMAGE_REPOSITORY:$CI_COMMIT_TAG"

        echo "===== PUSH VERSION IMAGE ====="
        echo "Image version = $IMAGE_VERSION"

        docker tag "$IMAGE_SHA" "$IMAGE_VERSION"
        docker push "$IMAGE_VERSION"
      fi

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_LATEST="$IMAGE_REPOSITORY:latest"

        echo "===== PUSH LATEST IMAGE ====="
        echo "Image latest = $IMAGE_LATEST"

        docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
        docker push "$IMAGE_LATEST"
      fi

  after_script:
    - |
      docker logout || true