# v tags publish official builds; u tags publish UAT builds.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[vu][0-9]+[.][0-9]+[.][0-9]+$/'
    - when: never

stages:
  - build

variables:
  DOCKERHUB_REPOSITORY: "nexora-webapi"

build_image_production:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - |
      : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
      : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"
      image="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY:$CI_COMMIT_TAG"
      printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      docker build --pull --tag "$image" .
      docker push "$image"
  after_script:
    - docker logout || true

build_image_uat:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_TAG =~ /^u[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - |
      : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
      : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"
      image="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY:$CI_COMMIT_TAG"
      printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      docker build --pull --tag "$image" .
      docker push "$image"
  after_script:
    - docker logout || true
